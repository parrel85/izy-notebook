# Crea gli eseguibili per Windows e Mac.
# - Avvio manuale (Actions > Build Quaderno > Run workflow): i file restano negli "Artifacts" del run.
# - Push di un tag "v1.2.0": i file vengono anche allegati a una Release pubblica.
name: Build Quaderno

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Quaderno-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Quaderno ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
