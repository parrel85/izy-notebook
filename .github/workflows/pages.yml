# Pubblica la versione browser (cartella app/) su GitHub Pages a ogni modifica di app/.
# Prima volta: Settings > Pages > Source: "GitHub Actions".
name: Pubblica versione browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
